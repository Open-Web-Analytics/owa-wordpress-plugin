name: CI
on:
  pull_request:
  push:
    branches: [master]
jobs:
  test:
    name: PHP ${{ matrix.php }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.2', '8.3', '8.4']
    steps:
    - uses: actions/checkout@v4
    - uses: shivammathur/setup-php@v2
      with:
        php-version: ${{ matrix.php }}
        coverage: none
    - name: Install dependencies
      run: composer install --no-interaction --no-progress
    - name: Lint
      run: composer lint
    - name: Test
      run: composer test

  # The admin pages' logic (Vitest) and their build (wp-scripts).
  javascript:
    name: JavaScript
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-node@v4
      with:
        node-version: '24'
        cache: npm
    - run: npm ci --no-audit --no-fund
    - name: Unit tests
      run: npm run test:unit
    - name: Build
      run: npm run build

  # What the WordPress.org deploy would ship: a --no-dev install filtered by
  # .distignore, as the deploy action does.
  package:
    name: Package
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: shivammathur/setup-php@v2
      with:
        php-version: '8.2'
        coverage: none
    - uses: actions/setup-node@v4
      with:
        node-version: '24'
        cache: npm
    - name: Build the admin pages
      run: |
        npm ci --no-audit --no-fund
        npm run build
    - name: Install runtime dependencies only
      run: composer install --no-dev --optimize-autoloader --no-interaction --no-progress
    - name: Check the package
      run: bin/check-package.sh

  # The plugin against a real OWA server: the tracker is served where the tag
  # loads it, and the signed GET /base/v1/sites answers the Website ID picker.
  integration:
    name: OWA ${{ matrix.owa }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - owa: '1.14.0'
            release: '1.14.0'
            groups: 'owa1'
          - owa: 'v2'
            branch: 'v2'
            # v2 still takes the 1.x keys; owa2 is the bundle tag and app passwords
            groups: 'owa1,owa2'
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
        ports: ['3306:3306']
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -proot"
          --health-interval=5s --health-timeout=5s --health-retries=24
    steps:
    - uses: actions/checkout@v4
    - uses: shivammathur/setup-php@v2
      with:
        php-version: '8.2'
        extensions: mysqli, pdo_mysql
        tools: composer:v2
        coverage: none
    - name: Install dependencies
      run: composer install --no-interaction --no-progress
    - uses: ./.github/actions/owa-server
      with:
        release: ${{ matrix.release }}
        branch: ${{ matrix.branch }}
        app-passwords: ${{ contains(matrix.groups, 'owa2') }}
    - name: Integration tests
      run: composer test:integration -- --fail-on-skipped --group '${{ matrix.groups }}'
    - name: Server logs
      if: failure()
      run: |
        cat "$RUNNER_TEMP/owa-server.log" || true
        find "$OWA_DIR/owa-data" -name '*.log' -exec tail -n 80 {} + || true

  # The plugin in a real WordPress, driven in a browser: a single site, and a
  # subdomain multisite in network mode. Screenshots are uploaded as an artifact.
  wordpress:
    name: WordPress ${{ matrix.mode }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        mode: [single, multisite]
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
        ports: ['3306:3306']
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -proot"
          --health-interval=5s --health-timeout=5s --health-retries=24
    steps:
    - uses: actions/checkout@v4
    - uses: shivammathur/setup-php@v2
      with:
        php-version: '8.2'
        extensions: mysqli, pdo_mysql
        tools: composer:v2, wp-cli
        coverage: none
    - name: Install dependencies
      run: composer install --no-interaction --no-progress
    - uses: ./.github/actions/owa-server
      with:
        branch: v2
        app-passwords: 'true'
        domain: https://wp.test
        profiles: |
          https://a.wp.test Site A
          https://www.other.example Other
    - name: Host names
      run: echo "127.0.0.1 wp.test a.wp.test b.wp.test c.wp.test" | sudo tee -a /etc/hosts
    - name: Install WordPress (${{ matrix.mode }})
      run: |
        WP="$RUNNER_TEMP/wordpress"
        echo "WP_DIR=$WP" >> "$GITHUB_ENV"
        mysql -h 127.0.0.1 -uroot -proot -e 'CREATE DATABASE wordpress'
        wp core download --path="$WP" --quiet
        wp config create --path="$WP" --dbname=wordpress --dbuser=root --dbpass=root --dbhost=127.0.0.1 --skip-check
        if [ "${{ matrix.mode }}" = multisite ]; then
          wp core multisite-install --path="$WP" --subdomains --url=http://wp.test --title="WP network" --admin_user=admin --admin_password=password --admin_email=admin@example.test --skip-email
          wp site create --path="$WP" --slug=a --title="Site A"
          wp site create --path="$WP" --slug=b --title="Site B"
        else
          wp core install --path="$WP" --url=http://wp.test --title="WP single" --admin_user=admin --admin_password=password --admin_email=admin@example.test --skip-email
        fi
        wp core version --path="$WP"
        ln -s "$GITHUB_WORKSPACE" "$WP/wp-content/plugins/owa-wordpress"
        mkdir -p "$WP/wp-content/mu-plugins"
        cp "$GITHUB_WORKSPACE/tests/e2e/owa-ci.php" "$WP/wp-content/mu-plugins/"
        if [ "${{ matrix.mode }}" = multisite ]; then
          wp plugin activate owa-wordpress --network --path="$WP"
        else
          wp plugin activate owa-wordpress --path="$WP"
        fi
    - name: Serve WordPress
      run: |
        sudo -E env PHP_CLI_SERVER_WORKERS=4 nohup "$(command -v php)" -S 0.0.0.0:80 -t "$WP_DIR" > "$RUNNER_TEMP/wp-server.log" 2>&1 &
        for i in $(seq 1 40); do curl -fs -o /dev/null http://wp.test/wp-login.php && exit 0; sleep 0.5; done
        echo "WordPress did not start"; cat "$RUNNER_TEMP/wp-server.log"; exit 1
    - uses: actions/setup-node@v4
      with:
        node-version: '24'
        cache: npm
    - name: Build the admin pages and install Playwright
      run: |
        npm ci --no-audit --no-fund
        npm run build
        npx playwright install --with-deps chromium
    - name: Browser tests
      run: npx playwright test --project=${{ matrix.mode }}
    - uses: actions/upload-artifact@v4
      if: always()
      with:
        name: screenshots-${{ matrix.mode }}
        path: |
          screenshots/
          test-results/
        if-no-files-found: ignore
    - name: Server logs
      if: failure()
      run: |
        tail -n 100 "$RUNNER_TEMP/wp-server.log" || true
        cat "$RUNNER_TEMP/owa-server.log" || true
